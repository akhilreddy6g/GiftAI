rules:
- id: R-001
  rule: Avoid buying gifts that feel strictly like corporate work for hire or generic mass-market formulas.
  rationale: Commercial art created merely to meet market demand lacks the genuine insight and spirit
    of a true gift.
  kind: dont
  relationships: []
  occasions: []
  budget_min_usd: null
