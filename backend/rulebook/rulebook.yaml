  - source: hyde-the-gift-1983
    location: Conclusion
- id: R-002
  rule: Avoid gifts that rely on abstract concepts rather than concrete imagery.
  rationale: Abstract ideas dull the emotional impact and disconnect the recipient from the true sentiment
    of the present.
  kind: dont
  relationships: []
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
