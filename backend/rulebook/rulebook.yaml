    location: '• Usury: A History of Gift Exchange (part 2); • A Draft of Whitman (part 1); • Ezra Pound
      and the...'
- id: R-003
  rule: Ensure that any gift you give to a close relative is presented unconditionally without leveraging
    it for payback or control.
  rationale: Treating a gift as a transaction or debt ruins the affection behind it and drains away the
    positive bonding power.
  kind: do
  relationships:
  - partner
  - parent
  - child
  - sibling
  - grandparent
  - relative
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
  sources:
  - source: ruhlin-giftology-2016
    location: 'Part I: The Power of Giving; Bibliography'
  - source: hyde-the-gift-1983
    location: • The Bond
- id: R-004
  rule: Avoid buying expensive items under the assumption that a higher price tag automatically signals
    deeper thoughtfulness.
  rationale: While givers assume cost equates to a stronger signal of consideration, recipients do not
    evaluate the thoughtfulness of a present based on how much it cost.
  kind: dont
  relationships: []
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
  sources:
  - source: gino-flynn-2011
    location: pp. 1-8
  - source: flynn-adams-2009
    location: pp. 1-6
- id: R-005
  rule: Do not select gifts based solely on your own personal preferences or what you wish to receive.
  rationale: True love in a relationship is an intentional choice to meet the other person's specific
    emotional needs rather than defaulting to your own instincts.
  kind: dont
  relationships:
  - partner
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
  sources:
  - source: chapman-five-love-languages-1992
    location: Chapter 7 - Discovering Love That Lasts
  - source: hyde-the-gift-1983
    location: • The Commerce of the Creative Spirit; • Ezra Pound and the Fate of Vegetable Money (part
      3)
- id: R-006
  rule: Choose gifts that elicit strong emotional responses during their consumption rather than gifts
    that generate only mild enjoyment.
  rationale: The relationship-strengthening effect of gifts is driven by the intensity of emotion felt
    while consuming the gift.
  kind: do
  relationships: []
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
  sources:
  - source: chan-mogilner-2017
    location: pp. 1-11 (part 1)
- id: R-007
  rule: Do not assume that physical goods cannot build strong bonds; if you give a material item, frame
    it around the experience it provides.
  rationale: Highlighting the experiential aspect of a material item makes it more effective at strengthening
    relationships.
  kind: do
  relationships: []
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
  sources:
  - source: chan-mogilner-2017
    location: pp. 1-11 (part 1)
- id: R-008
  rule: Do not feel obligated to participate in the experience alongside the recipient for the gift to
    be effective.
  rationale: Experiential gifts improve relationships regardless of whether the giver consumes the experience
    together with the recipient.
  kind: dont
  relationships: []
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
  sources:
  - source: chan-mogilner-2017
    location: pp. 1-11 (part 1)
- id: R-009
  rule: Focus on the recipient's emotional experience while they use or live through the gift rather than
    just their reaction at the moment of exchange.
  rationale: The emotions felt during consumption drive the long-term relational benefits, whereas initial
    exchange reactions are similar for all gifts.
  kind: do
  relationships: []
  occasions: []
  budget_min_usd: null
  budget_max_usd: null
