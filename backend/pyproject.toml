[project]
name = "giftai"
version = "0.1.0"
description = "GiftAI backend: an agentic gift recommender for Amazon US."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giftai"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "migrations"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "A",       # shadowed builtins
    "C4",      # comprehensions
    "SIM",     # simplify
    "RET",     # return statements
    "PTH",     # pathlib over os.path
    "ASYNC",   # async pitfalls
    "S",       # bandit security checks
    "ANN",     # type annotations required
    "RUF",
]
ignore = [
    "ANN401",  # Any is sometimes the honest type for **kwargs passthroughs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom puts Depends() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "migrations"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "database: needs a real Postgres with pgvector (set TEST_DATABASE_URL)",
]
