<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GiftAI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="GiftAI asks about the person you're shopping for and suggests thoughtful Amazon gifts that fit your budget."
    />
    <meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Applies the saved theme before the first paint, so dark mode never flashes light.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('giftai-theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>GiftAI needs JavaScript to run. Please turn it on and reload the page.</noscript>
  </body>
</html>
